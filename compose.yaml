services:
  mailpit:
    image: axllent/mailpit:v1.27
    ports:
      - "127.0.0.1:8025:8025"
  mongo:
    image: mongo:8
    command: ["mongod", "--replSet", "rs0", "--bind_ip_all"]
    restart: unless-stopped
    volumes:
      - mongo_data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand({ ping: 1 }).ok"]
      interval: 5s
      timeout: 5s
      retries: 20
  mongo-init:
    image: mongo:8
    depends_on:
      mongo:
        condition: service_healthy
    entrypoint: ["bash", "-c", "mongosh --host mongo --quiet --eval \"try { rs.status() } catch (error) { rs.initiate({_id:'rs0',members:[{_id:0,host:'mongo:27017'}]}) }\""]
  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    env_file: apps/api/.env
    environment:
      MONGODB_URL: mongodb://mongo:27017/openstacktools_ai?replicaSet=rs0
      DASHBOARD_ORIGIN: http://localhost:5173
      NODE_ENV: development
      COOKIE_SECURE: "false"
      SMTP_HOST: mailpit
      SMTP_PORT: "1025"
      SMTP_FROM: "OpenStackTools AI <no-reply@localhost>"
    ports:
      - "127.0.0.1:5000:5000"
    depends_on:
      mongo-init:
        condition: service_completed_successfully
      mailpit:
        condition: service_started
  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    environment:
      API_PROXY_TARGET: http://api:5000
    ports:
      - "127.0.0.1:5173:5173"
    depends_on:
      - api
volumes:
  mongo_data:
