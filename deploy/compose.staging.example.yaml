# Example only. Copy staging.api.env.example to an ignored staging.api.env,
# replace every placeholder, and provision private authenticated MongoDB.
# Do not start this file without an approved staging hostname and TLS setup.
services:
  api:
    build:
      context: ..
      dockerfile: apps/api/Dockerfile
    env_file: ./staging.api.env
    environment:
      NODE_ENV: production
      COOKIE_SECURE: "true"
      TRUST_PROXY: "1"
    expose:
      - "5000"
    init: true
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
  web:
    build:
      context: ..
      dockerfile: apps/web/Dockerfile
    environment:
      API_UPSTREAM: http://api:5000
    expose:
      - "5173"
    depends_on:
      - api
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
  edge:
    image: caddy:2-alpine
    environment:
      STAGING_HOST: ${STAGING_HOST:?set an approved staging hostname}
    volumes:
      - ./Caddyfile.staging.example:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    ports:
      - "80:80"
      - "443:443"
    depends_on:
      - web
      - api
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
volumes:
  caddy_data:
  caddy_config:
